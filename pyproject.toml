[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-paper-trader"
version = "0.1.0"
description = "Paper market maker. Code decides, Jev judges, risk can veto."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "websocket-client>=1.8",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
jev = ["typesafe-sdk"]
agent = ["langgraph>=0.2", "anthropic"]
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.8"]

[project.scripts]
jev-paper = "jev_paper.loop:main"
jev-dashboard = "jev_paper.dashboard.app:main"
jev-analyst = "jev_paper.agent.analyst:main"
jev-record = "jev_paper.data.record:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
